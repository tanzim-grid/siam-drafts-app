<script>/* Siam drafts: additive authenticated storage adapter. No privileged key. */
window.BoardSync = (() => {
  const API='https://uayxhyruyapwkkekdefs.supabase.co/functions/v1/siam-gateway';
  const SESSION_KEY='siam-shared-session-v1', EXPIRY_KEY='siam-shared-expiry-v1', persist=window.localStorage;
  try {
    if(!persist.getItem(SESSION_KEY)){
      const prior=window.sessionStorage.getItem(SESSION_KEY);
      if(prior){
        persist.setItem(SESSION_KEY,prior);
        const exp=window.sessionStorage.getItem(EXPIRY_KEY);
        if(exp) persist.setItem(EXPIRY_KEY,exp);

  } catch(_){}
  let token=persist.getItem(SESSION_KEY);
  let cachedBatch=null;
  const clearSession=()=>{try{persist.removeItem(SESSION_KEY);persist.removeItem(EXPIRY_KEY);window.sessionStorage.removeItem(SESSION_KEY);window.sessionStorage.removeItem(EXPIRY_KEY);}catch(_){} token=null;};
  const saveSession=(next,expires)=>{token=next;persist.setItem(SESSION_KEY,next);if(expires)persist.setItem(EXPIRY_KEY,String(Date.parse(expires)));};
  const armExpiry=()=>{

    if(wait>2147483647){setTimeout(armExpiry,2147483647);return;}

  };
  async function request(path, options={}) {
    let response;

    catch (_) {throw new Error('Cannot reach the board server. Check your connection and retry.');}
    let data;try {data=await response.json();}catch (_) {throw new Error('The board server returned an unreadable response. Please retry.');}
    if(!response.ok) {
      if(response.status===401) {clearSession();if(mounted)location.reload();}
      if(path==='/login' && response.status===401)throw new Error('Password did not match. It is case-sensitive; use Show to check what you type.');
      if(response.status===429)throw new Error('Too many unlock attempts. Wait five minutes before trying again.');
      if(response.status>=500)throw new Error('The board server is temporarily unavailable. Your password was not rejected; please retry later.');
      throw new Error(data.error||'Board request failed (HTTP '+response.status+').');
    }
    return data;
  }
  let user, day, prefix, busy = false, retry = 1000, timer, stateRows = [], mounted = false;
  const raw = window.localStorage;
  const status = { phase: 'locked', lastError: null };
  let resolveReady;
  const ready = new Promise(resolve => { resolveReady = resolve; });
  const clone = value => JSON.parse(JSON.stringify(value));
  const parse = (s, fallback) => { try { return JSON.parse(s) ?? fallback; } catch { return fallback; } };
  const outboxKey = () => prefix + 'outbox-v1';
  const queue = () => parse(raw.getItem(outboxKey()), []);
  const saveQueue = q => raw.setItem(outboxKey(), JSON.stringify(q));
  const keyFor = key => prefix + key;
  function describe(key, value) {
    let kind, scope = day, obj = parse(value, {});
    if (key === 'board-theme') return { kind: 'theme', scope: 'global', items: { theme: { value } } };
    if (key === 'board-uinotes') return { kind: 'uinote', scope: 'global', items: Object.fromEntries((obj || []).map(x => [x.id, x])) };
    if (key === 'board-forlater') {
      const bag = parse(value, {});
      const items = (bag && bag.items && typeof bag.items === 'object' && !Array.isArray(bag.items)) ? bag.items : {};
      const out = {};
      for (const [k, it] of Object.entries(items)) {
        if (it && it.uid === k && typeof it.text === 'string') out[k] = it;
      }
      return { kind: 'forlater', scope: 'global', items: out };
    }
    const copied = key.match(/^board-feedback-copied-(\d{4}-\d{2}-\d{2})$/);
    if (copied) return { kind: 'exported', scope: copied[1], items: { fingerprint: { value } } };
    const m = key.match(/^board-(feedback|hidden|done|history)-(\d{4}-\d{2}-\d{2})$/);
    if (!m) return null;
    kind = m[1];
    return { kind, scope: m[2], items: ['hidden','done'].includes(kind) ? Object.fromEntries((Array.isArray(obj) ? obj : []).map(x => [x, {value:true}])) : obj };
  }
  function updateStatus() {
    const el = document.getElementById('masum-sync-label');
    if (el) el.textContent = status.phase === 'synced' ? 'Saved online' : status.phase === 'queued' ? 'Saved locally · sync pending' : status.phase === 'syncing' ? 'Syncing…' : 'Unlocked · ready';
  }
  const storage = {
    getItem(key) { return raw.getItem(keyFor(key)); },
    setItem(key, value) {
      value = String(value);
      const old = raw.getItem(keyFor(key));
      raw.setItem(keyFor(key), value);
      if (old === value) return;
      const next = describe(key, value), prev = describe(key, old ?? (key === 'board-uinotes' || key.includes('hidden-') || key.includes('done-') ? '[]' : key === 'board-forlater' ? '{"version":1,"items":{}}' : '{}'));
      if (!next) return;
      const q = queue();
      for (const item of new Set([...Object.keys(prev.items), ...Object.keys(next.items)])) {
        const a = prev.items[item] || {}, b = next.items[item] || {}, patch = {};
        for (const field of new Set([...Object.keys(a), ...Object.keys(b)])) {
          if (JSON.stringify(a[field]) !== JSON.stringify(b[field])) patch[field] = b[field] === undefined ? null : b[field];
        }
        if (Object.keys(patch).length) q.push({ id: crypto.randomUUID(), day: next.scope, kind: next.kind, item, patch });
      }
      saveQueue(q); status.phase = 'queued'; updateStatus(); schedule(400);
    }
  };
  const entityKey = r => JSON.stringify([r.day, r.kind, r.item]);
  function materialize() {
    const map = new Map(stateRows.map(r => [entityKey(r), clone(r)]));
    for (const e of queue()) {
      const k = entityKey(e), row = map.get(k) || { day:e.day,kind:e.kind,item:e.item,value:{} };
      for (const [field,value] of Object.entries(e.patch)) {
        if (value === null) delete row.value[field]; else row.value[field] = value;
      }
      map.set(k,row);
    }
    const grouped = {};
    for (const r of map.values()) {
      if (r.day !== day && r.day !== 'global') continue;
      (grouped[r.kind] ||= {})[r.item] = r.value;
    }
    const put = (k,v) => raw.setItem(keyFor(k),v);
    for (const kind of ['feedback','history']) {
      const obj = Object.fromEntries(Object.entries(grouped[kind] || {}).filter(([,v]) => Object.keys(v).length));
      put('board-' + kind + '-' + day, JSON.stringify(obj));
    }
    for (const kind of ['hidden','done']) put('board-' + kind + '-' + day, JSON.stringify(Object.entries(grouped[kind] || {}).filter(([,v]) => v.value).map(([k]) => k)));
    put('board-uinotes', JSON.stringify(Object.values(grouped.uinote || {}).filter(v => v.id).sort((a,b) => a.ts-b.ts)));
    put('board-forlater', JSON.stringify({ version: 1, items: grouped.forlater || {} }));
    put('board-theme',grouped.theme?.theme?.value === 'dark' ? 'dark' : 'light');
    put('board-feedback-copied-' + day,grouped.exported?.fingerprint?.value || '');
  }
  async function pull() {
    const data=await request('/state?day='+encodeURIComponent(day));
    const before = JSON.stringify(stateRows); stateRows = data;
    materialize();
    if (mounted && before !== JSON.stringify(data)) window.dispatchEvent(new Event('masum:remote'));
  }
  function schedule(ms) { clearTimeout(timer); timer = setTimeout(flush,ms); }

    if (busy || !user || !day) return;
    busy = true; status.phase='syncing'; updateStatus();
    try {
      if (!navigator.onLine) throw new Error('Offline');
      while (queue().length) {
        const e=queue()[0];
        await request('/event',{method:'POST',body:JSON.stringify(e)});
        saveQueue(queue().filter(x=>x.id!==e.id));
      }
      await pull(); retry=1000; status.phase=queue().length ? 'queued':'synced'; status.lastError=null;
    } catch(e) { status.phase='queued'; status.lastError=e.message; schedule(retry); retry=Math.min(60000,retry*2); }
    finally { busy=false; updateStatus(); }
  }
  const gate=document.createElement('div'); gate.id='masum-auth';
  gate.style.cssText='position:fixed;inset:0;background:#f7f7f8;z-index:9999;display:grid;place-items:center;font-family:system-ui;color:#202124';
  gate.innerHTML='<form style="width:min(360px,90vw);display:grid;gap:14px"><h1>Masumparvej_ post drafts</h1><p>Enter the board password to unlock.</p><label>Password <input name="password" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required autofocus style="width:100%;padding:10px;box-sizing:border-box"></label><button type="button" data-show-password aria-pressed="false">Show password</button><button type="submit" style="padding:10px">Unlock</button><p role="status">Private drafts stay on the server until unlocked.</p><small>Sign-in v2 · Password is case-sensitive.</small></form>';
  document.body.appendChild(gate);
  const reveal=gate.querySelector('[data-show-password]');
  reveal.onclick=()=>{const field=gate.querySelector('form').elements.password;field.type=field.type==='password'?'text':'password';reveal.textContent=field.type==='password'?'Show password':'Hide password';reveal.setAttribute('aria-pressed',String(field.type==='text'));};
  const message=text=>{gate.querySelector('[role=status]').textContent=text;};
  const selectedDay=()=>{const value=new URL(location.href).searchParams.get('date');if(value&&!/^\d{4}-\d{2}-\d{2}$/.test(value))throw new Error('Invalid date');return value;};
  async function loadBatch(requestedDay) {
    if(!token)throw new Error('Password required');
    const key=requestedDay||'latest';
    if(cachedBatch?.key===key)return cachedBatch.value;
    const value=await request('/batch'+(requestedDay?'?day='+encodeURIComponent(requestedDay):''));
    if(!value||!Array.isArray(value.ROWS)||value.ROWS.length!==5)throw new Error('Invalid batch');
    cachedBatch={key,value};return value;
  }
  async function unlock() {
    await loadBatch(selectedDay());
    user='shared';prefix='siam:masum:shared-v1:';
    gate.remove();resolveReady();
    armExpiry();
  }
  async function lock() {
    try {if(token)await request('/logout',{method:'POST',body:'{}'});}catch(_){}
    clearSession();location.reload();
  }
  gate.querySelector('form').onsubmit=async e=>{
    e.preventDefault();const form=e.currentTarget,button=form.querySelector('button[type=submit]');button.disabled=true;message('Unlocking…');
    try {
      const result=await request('/login',{method:'POST',body:JSON.stringify({password:form.elements.password.value})});
      form.elements.password.value='';
      saveSession(result.token,result.expires_at);
      await unlock();
    } catch(e) {message(e.message);}
    finally {form.elements.password.value='';button.disabled=false;}
  };
  if(token)unlock().catch(()=>{message('Session unavailable or expired. Enter the password to unlock.');});
  async function init(date) {
    day=date;
    await pull(); // Never overwrite a local outbox during hydration.
    const bar=document.createElement('div');
    bar.style.cssText='position:fixed;bottom:10px;right:12px;z-index:100;background:#fff;border:1px solid #ddd;border-radius:8px;padding:8px;font:12px system-ui;color:#444';
    bar.innerHTML='<span id="masum-sync-label">Unlocked · ready</span> <button type="button">Lock</button>';
    bar.querySelector('button').onclick=lock; document.body.appendChild(bar);
    mounted=true; schedule(100);
    window.addEventListener('online',()=>schedule(0));
    window.addEventListener('focus',()=>schedule(0));
    window.addEventListener('storage',e=>{if(e.key===outboxKey()) schedule(0);});
    setInterval(()=>schedule(0),20000);
  }
  async function readFeedback(d) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return {};
    const key = 'board-feedback-' + d;
    if (d === day) return parse(storage.getItem(key), {});
    const fromRows = rows => {
      const map = new Map((rows || []).filter(r => r.day === d && r.kind === 'feedback').map(r => [entityKey(r), clone(r)]));
      for (const e of queue()) {
        if (e.day !== d || e.kind !== 'feedback') continue;
        const k = entityKey(e), row = map.get(k) || { day: e.day, kind: e.kind, item: e.item, value: {} };
        for (const [field, value] of Object.entries(e.patch)) {
          if (value === null) delete row.value[field]; else row.value[field] = value;
        }
        map.set(k, row);
      }
      return Object.fromEntries([...map.values()].filter(r => Object.keys(r.value).length).map(r => [r.item, r.value]));
    };
    try {
      const data = await request('/state?day='+encodeURIComponent(d));
      stateRows = stateRows.filter(r => r.day !== d).concat((data || []).filter(r => r.day === d));
      const obj = fromRows(stateRows);
      raw.setItem(keyFor(key), JSON.stringify(obj));
      return obj;
    } catch (_) {
      return parse(storage.getItem(key), {});
    }
  }
  return {ready,init,storage,flush,status,loadBatch,readFeedback};
})();

/* Light theme: neutral surfaces, restrained accents, explicit semantic contrast. */
.hg-app.hg-light{--ink:#202124;--muted:#686b72;--line:#e3e4e7;--surface:#fff;background:#f7f7f8;color:#42454d;color-scheme:light}
.hg-light ::selection{background:#dde4ff;color:#202124}
.hg-light .hg-title,.hg-light .hg-slot-heading,.hg-light .hg-card-label,.hg-light .hg-trending-title,.hg-light .hg-trend-title{color:var(--ink)}
.hg-light .hg-subtitle,.hg-light .hg-counters,.hg-light .hg-star-hint,.hg-light .hg-slot-meta,.hg-light .hg-note-preview,.hg-light .hg-note-status,.hg-light .hg-trend-context,.hg-light .hg-trend-takeaways{color:var(--muted)}
.hg-light .hg-toolbar-primary{background:#fff;border-color:var(--line);box-shadow:0 1px 3px #20212404;border-radius:12px;padding:10px}
.hg-light .hg-toolbar-secondary{border-color:var(--line)}
.hg-light .hg-button,.hg-light .hg-history-button,.hg-light .hg-hide-button,.hg-light .hg-gem-button,.hg-light .hg-approve-button,.hg-light .hg-edit-button,.hg-light .hg-uinote-del{background:#fff;color:#51545c;border-color:#dedfe3;box-shadow:0 1px 2px #20212403}
.hg-light .hg-button:not(:disabled):hover,.hg-light .hg-history-button:not(:disabled):hover,.hg-light .hg-hide-button:hover,.hg-light .hg-gem-button:hover,.hg-light .hg-approve-button:hover,.hg-light .hg-edit-button:hover{background:#f1f2f4;border-color:#c7c9cf;color:#202124}
.hg-light .hg-button:disabled,.hg-light .hg-history-button:disabled{opacity:1;color:#a0a2aa;background:#fafafb;border-color:#e8e9ec}
.hg-light .hg-search,.hg-light .hg-select,.hg-light .hg-note-input{background:#fafafb;color:var(--ink);border-color:#dedfe3!important}
.hg-light .hg-search::placeholder,.hg-light .hg-note-input::placeholder{color:#777b84}
.hg-light .hg-search:focus,.hg-light .hg-select:focus,.hg-light .hg-note-input:focus{background:#fff;border-color:#7888b4!important;box-shadow:0 0 0 3px #5269ae14!important}
.hg-light .hg-feedback-button,.hg-light .hg-banner .hg-button{background:#25272c!important;color:#fff!important;border-color:#25272c!important;box-shadow:0 1px 2px #20212418}
.hg-light .hg-feedback-button:hover,.hg-light .hg-banner .hg-button:hover{background:#3b3e45!important;border-color:#3b3e45!important;color:#fff!important}
.hg-light .hg-danger-button{background:#b42332!important;border-color:#b42332!important;color:#fff!important}
.hg-light .hg-confirm-text{color:#912737}
.hg-light .hg-slot{border-top-color:var(--line);border-left-color:color-mix(in srgb,var(--slot-accent) 45%,#e3e4e7)}
.hg-light .hg-slot-history{background:#f7f7f8f5;backdrop-filter:blur(12px)}
.hg-light .hg-slot-history .hg-history-button{background:#fff;border-color:#dedfe3;color:#62656e}
.hg-light .hg-slot-history .hg-history-button:disabled{background:#fafafb;color:#a0a2aa;border-color:#e3e4e7}
.hg-light .hg-slot-history .hg-history-button:not(:disabled):hover{background:#eceef1;color:#202124;border-color:#c7c9cf}
.hg-light .hg-slot-num{background:color-mix(in srgb,var(--slot-accent) 10%,#fff);color:color-mix(in srgb,var(--slot-accent) 58%,#202124);border:1px solid color-mix(in srgb,var(--slot-accent) 18%,#e3e4e7)}
.hg-light .hg-rated{background:#fff;border-color:#dedfe3;color:#51545c}
.hg-light .hg-star{color:#a4a7af!important}
.hg-light .hg-star[style]:has(svg[fill="currentColor"]){color:color-mix(in srgb,var(--slot-accent) 65%,#202124)!important}
.hg-light .hg-star-hint{color:var(--muted)!important}
.hg-light .hg-slot-controls>.hg-button,.hg-light .hg-note-preview button{color:#51545c!important;border-color:#dedfe3!important}
.hg-light .hg-card{background:#fff;border-color:#e0e1e5;box-shadow:0 1px 2px #20212405,0 4px 12px #20212403;border-radius:13px}
.hg-light .hg-card:before{display:none}
.hg-light .hg-card--draft{background:#fff;border-color:#c8cbd2;box-shadow:0 1px 2px #20212408,0 4px 12px #20212404}

.hg-forlater{margin:16px 0 4px;border:1px solid #292f3a;border-radius:12px;background:#11151c}
.hg-forlater-toggle{display:flex;align-items:center;gap:8px;width:100%;box-sizing:border-box;min-height:42px;padding:8px 12px;background:transparent;border:0;border-radius:12px;color:#cbd1dc;font:600 13px/1.4 inherit;font-family:inherit;cursor:pointer;text-align:left}
.hg-forlater-toggle:hover{background:#ffffff06;color:#fff}
.hg-forlater-toggle:focus-visible{outline:2px solid #22d3ee;outline-offset:2px}
.hg-forlater-chev{transition:transform .16s;flex:0 0 auto}
.hg-forlater[data-open="true"] .hg-forlater-chev{transform:rotate(90deg)}
.hg-forlater-count{color:#8e98aa;font-weight:500}
.hg-forlater-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:10px;padding:4px 12px 12px}
.hg-forlater-list[hidden]{display:none}
.hg-forlater-empty{color:#8e98aa;font-size:12.5px;padding:4px 2px 6px}
.hg-forlater-item{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0;padding:12px 12px 10px;border:1px solid #303845;border-radius:11px;background:#151a22}
.hg-forlater-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-right:34px;font-size:11.5px;color:#8e98aa}
.hg-forlater-tag{padding:1px 7px;border-radius:6px;border:1px solid #3a4452;color:#dce2eb;font-weight:650;font-size:11px}
.hg-forlater-topic{font-size:12px;color:#aeb7c5;overflow-wrap:anywhere}
.hg-forlater-text{font-size:13.5px;line-height:1.6;color:#dce2eb;white-space:pre-wrap;overflow-wrap:anywhere}
.hg-forlater-dates{font-size:11px;color:#8e98aa}
.hg-forlater-actions{display:flex;gap:8px;align-items:center}
.hg-forlater-actions .hg-button{min-height:30px;padding:4px 10px;display:inline-flex;align-items:center;gap:6px}
.hg-forlater-actions .hg-post-link{flex:0 0 auto;min-height:30px;padding:4px 10px;display:inline-flex;align-items:center}
.hg-forlater-item .hg-card-edit{margin-top:0}
.hg-forlater-item[data-approved]{border-color:#4ADE8080}
.hg-forlater-remove{position:absolute;top:8px;right:8px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;padding:0;border-radius:7px;background:transparent;border:1px solid #343e4c;color:#abb6c6;font-size:17px;line-height:1;cursor:pointer}
.hg-forlater-remove:hover{background:#3a1d22;border-color:#e5737f;color:#ffb3bb}
.hg-later-button[aria-pressed="true"]{background:#13313b!important;border-color:#22d3ee!important;color:#89e7f1!important}
.hg-card[data-later]:not(.hg-card--nw){min-height:0!important;opacity:.6}
.hg-card[data-later]:not(.hg-card--nw) .hg-card-text,.hg-card[data-later]:not(.hg-card--nw) .hg-card-footer{display:none!important}
.hg-card[data-later].hg-card--nw{opacity:.6}
.hg-card[data-later]:hover{opacity:1}
.hg-later-chip{margin-top:10px;align-self:flex-start;font-size:11.5px;color:#89e7f1;background:transparent;border:1px dashed #22d3ee80;border-radius:7px;padding:3px 9px;cursor:pointer;font-family:inherit}
.hg-light .hg-forlater{background:#fff;border-color:#dfe3e9;box-shadow:0 1px 3px #0f172a0a}
.hg-light .hg-forlater-toggle{color:#2c3440}
.hg-light .hg-forlater-toggle:hover{background:#f5f6f8;color:#0f141b}
.hg-light .hg-forlater-count,.hg-light .hg-forlater-empty,.hg-light .hg-forlater-meta,.hg-light .hg-forlater-dates{color:#5d6878}
.hg-light .hg-forlater-item{background:#fafbfc;border-color:#e1e5eb}
.hg-light .hg-forlater-item[data-approved]{border-color:#16a34a80}
.hg-light .hg-forlater-tag{border-color:#d3d9e1;color:#2c3440}
.hg-light .hg-forlater-topic{color:#5d6878}
.hg-light .hg-forlater-text{color:#30333a}
.hg-light .hg-forlater-remove{border-color:#d3d9e1;color:#51545c;background:#fff}
.hg-light .hg-forlater-remove:hover{background:#fde8ea;border-color:#e5737f;color:#b42332}
.hg-light .hg-later-button[aria-pressed="true"]{background:#e6f9fc!important;border-color:#0891b2!important;color:#0e7490!important}
.hg-light .hg-later-chip{color:#0e7490;border-color:#0891b280}
